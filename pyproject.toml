[project]
name = "cipherwatch"
version = "0.1.0"
description = "Metadata-Only Insider Data Exfiltration Detection System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "networkx>=3.2",
    "watchdog>=4.0.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "google-genai>=0.1.0",
    "pytest>=8.0.0",
    "loguru>=0.7.3",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "agent", "shared", "simulator"]


